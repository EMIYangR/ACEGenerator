<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="EMI Yang">
    <title>ACE Event Ranking & Points Generator</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/index.css">
    lin
</head>
<body>
<div id="container">
    <header id="pageHeader" class="panel">
        <div class="header-copy">
            <h1 id="pageTitle" data-i18n="pageTitle">ACE Event Ranking & Points Generator</h1>
        </div>
        <div class="header-tools">
            <button type="button" id="clearCookiesBtn" class="btn btn-danger" data-i18n="clearCookies">Clear cookies</button>
            <button type="button" id="clearStorageBtn" class="btn btn-danger" data-i18n="clearStorage">Clear local data</button>
            <button type="button" id="langToggle" class="btn lang-toggle">中文</button>
            <span id="toolbarStatus" class="status" role="status" aria-live="polite"></span>
        </div>
    </header>
    <div class="layout">
        <div id="quickNav" class="quick-nav"></div>
        <div class="side-column">
            <aside id="notesSidebar" class="sidebar sidebar-notes">
                <button type="button" id="notesToggle" class="sidebar-toggle" aria-expanded="true" data-i18n="sideNotesButton">☰ Notes</button>
                <div class="sidebar-body">
                    <section class="side-block">
                        <h3 data-i18n="sideTipsTitle">Notes</h3>
                        <div data-i18n-html="sideTipsHtml"></div>
                    </section>
                    <section class="side-block">
                        <h3 data-i18n="sideRulesTitle">Preset points rules</h3>
                        <div data-i18n-html="sideRulesHtml"></div>
                    </section>
                    <section class="side-block">
                        <h3 data-i18n="sideGuideTitle">Quick guide</h3>
                        <div data-i18n-html="sideGuideHtml"></div>
                    </section>
                </div>
            </aside>
            <footer id="meta">
                <div><span data-i18n="recentTitle">Recent updates</span>: <span data-i18n="recentText">Fixed some known issues.</span></div>
                <div id="projectAddress" data-i18n-html="projectAddress"></div>
            </footer>
        </div>
        <div class="main-column">
            <main id="content">
                <section class="panel">
                    <div class="panel-heading">
                        <h2 data-i18n="importTitle">Template import</h2>
                        <button type="button" class="fold-inline panel-fold" data-panel-fold="import" aria-expanded="true">▾</button>
                    </div>
                    <div class="panel-body" data-panel-body="import">
                        <textarea id="importText" spellcheck="false" data-i18n-ph="importPlaceholder"></textarea>
                        <div class="row">
                            <button type="button" id="importBtn" class="btn btn-primary" data-i18n="importBtn">Import template</button>
                            <button type="button" id="clearImportBtn" class="btn" data-i18n="clearBtn">Clear</button>
                            <span id="importMessage" class="status" role="status" aria-live="polite"></span>
                        </div>
                    </div>
                </section>
                <section class="panel">
                    <h2 data-i18n="controlTitle">Controls</h2>
                    <div id="controlNav" class="control-nav"></div>
                    <div class="point-bar">
                        <div id="pointRule" class="point-rule">
                            <span class="rule-label" data-i18n="pointRule">Points rule</span>
                            <label><input type="radio" name="globalSystem" value="single"><span data-i18n="single">BO1</span></label>
                            <label><input type="radio" name="globalSystem" value="4n" checked><span data-i18n="cycle">BO4</span></label>
                        </div>
                        <button type="button" id="addMatchBtn" class="btn btn-primary" data-i18n="addMatch">Add match</button>
                    </div>
                    <div id="matchList" class="match-list"></div>
                </section>
                <section class="panel">
                    <div class="panel-heading">
                        <h2 data-i18n="outputTitle">Output</h2>
                        <button type="button" class="fold-inline panel-fold" data-panel-fold="output" aria-expanded="true">▾</button>
                    </div>
                    <div class="panel-body" data-panel-body="output">
                        <div class="row output-actions">
                            <button type="button" id="copyBtn" class="btn" data-i18n="copy">Copy</button>
                            <button type="button" id="downloadBtn" class="btn" data-i18n="download">Download .txt</button>
                            <label class="format-control">
                                <span data-i18n="opponentFormat">Player output</span>
                                <select id="opponentFormat">
                                    <option value="oneLine" data-i18n="fmtOneLine">Single line</option>
                                    <option value="perRound" data-i18n="fmtPerRound">One round per line</option>
                                </select>
                            </label>
                            <span id="outputMessage" class="status" role="status" aria-live="polite"></span>
                        </div>
                        <pre id="output" class="output"></pre>
                    </div>
                </section>
            </main>
        </div>
    </div>
</div>
<button type="button" id="backToTop" class="back-to-top" data-i18n="backToTop">↑ Top</button>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
